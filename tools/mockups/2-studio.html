<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio editor mockup</title>
<link rel="stylesheet" href="mock.css">
<style>
.tb { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); flex-wrap: wrap; position: sticky; top: var(--barh); z-index: 40; }
.tb .pn { font-weight: 700; } .tb .pn span { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
.tb input[type=search] { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); padding: 7px 10px; width: 220px; font: inherit; }
.tb .sp { flex: 1; }
.chip { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.chip.on { color: var(--ink); border-color: var(--accent); }
.ab { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.ab button { background: none; border: 0; padding: 6px 12px; font: 700 13px var(--mono); color: var(--muted); cursor: pointer; }
.ab button.sel { background: var(--accent); color: #06212b; }
.layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - var(--barh) - 56px); }
aside { border-right: 1px solid var(--rule); padding: 12px 10px; position: sticky; top: calc(var(--barh) + 56px); align-self: start; max-height: calc(100vh - var(--barh) - 56px); overflow: auto; }
aside h5, main h2 { margin: 12px 4px 6px; font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.fxl { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.fxl:hover { background: var(--surface-2); }
.fxl .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--fc); }
.fxl.off { color: var(--muted); } .fxl.off .dot { opacity: .35; }
main { padding: 4px 16px 40px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; border-top: 3px solid var(--fc); }
.card.off { opacity: .62; }
.ch { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2); }
.ch .art { color: var(--fc); }
.ch h3 { margin: 0; font-size: 16px; }
.ch select { width: 100%; margin-top: 4px; }
select { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; font: 12px var(--mono); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 8px; font: 700 10px var(--mono); color: var(--faint); cursor: pointer; }
.seg button.sel { background: var(--surface-3); color: var(--ink); } .seg button.sel[data-s=on] { color: var(--on); } .seg button.sel[data-s=hit] { color: var(--hit); }
.rows { padding: 6px 12px 12px; }
.pr { display: grid; grid-template-columns: 120px 1fr 74px; align-items: center; gap: 10px; padding: 4px 0; }
.pr.hide { display: none; }
.pl { font: 600 11px var(--sans); letter-spacing: .04em; color: var(--muted); line-height: 1.2; }
.pl i { display: none; font: 10px var(--mono); color: var(--faint); font-style: normal; }
body.ids .pl i { display: block; }
.pl .adv { font: 700 8px var(--mono); color: var(--warn); border: 1px solid #f0b04a55; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
.pr.changed .pl { color: var(--warn); }
input[type=range] { width: 100%; accent-color: var(--fc); }
.val { font: 600 12px var(--mono); text-align: right; background: var(--bg); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 6px; color: var(--ink); width: 100%; }
.viz { margin: 0 12px 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--rule); }
.viz svg { display: block; width: 100%; height: auto; touch-action: none; }
.viz text { font: 9px var(--mono); fill: var(--faint); }
.matrix { width: 100%; border-collapse: collapse; font-size: 12px; }
.matrix th { font: 600 10px var(--mono); color: var(--muted); padding: 6px; text-align: center; }
.matrix th:first-child { text-align: left; }
.matrix td { padding: 4px 6px; text-align: center; border-top: 1px solid var(--rule); }
.matrix td:first-child { text-align: left; font-weight: 600; }
.send { display: grid; gap: 2px; justify-items: center; }
.send input { width: 80px; accent-color: var(--accent); }
.send span { font: 10px var(--mono); color: var(--muted); }
.na { color: var(--faint); }
.mix { display: flex; gap: 6px; padding: 12px; overflow-x: auto; }
.fader { display: grid; justify-items: center; gap: 6px; width: 64px; flex: none; }
.fader input { writing-mode: vertical-lr; direction: rtl; height: 150px; width: 28px; accent-color: var(--accent); }
.fader b { font: 600 9px var(--sans); color: var(--muted); text-align: center; letter-spacing: .05em; height: 22px; }
.fader span { font: 11px var(--mono); }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } aside { display: none; } .tb { top: var(--barh); } }
</style>
</head>
<body class="ids">
<div class="tb">
  <input type="search" id="q" placeholder="Find a parameter… (e.g. decay, 0x167)">
  <button class="chip on" id="tIds">IDs</button>
  <button class="chip on" id="tAdv">Advanced</button>
  <button class="chip" id="tChg">Changed only</button>
  <span class="sp"></span>
  <span class="note">Compare</span><div class="ab"><button class="sel">A</button><button>B</button></div>
  <button class="chip">↶ Undo</button><button class="chip">Save preset…</button>
</div>
<div class="layout">
  <aside id="side"></aside>
  <main>
    <h2>Vocal</h2><div class="grid" id="gv"></div>
    <h2>Guitar</h2><div class="grid" id="gg"></div>
    <h2>Routing &amp; mix</h2>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(420px, 1fr))">
      <div class="card" style="--fc:var(--accent)"><div class="ch" style="grid-template-columns:1fr"><h3>Effect sends</h3><div class="note">Send levels the firmware keeps per preset (parameters 0x0AB–0x0B7). The pedal never shows these.</div></div><div class="rows"><table class="matrix" id="mx"></table></div></div>
      <div class="card" style="--fc:var(--accent)"><div class="ch" style="grid-template-columns:1fr"><h3>Mix</h3><div class="note">MIX pages 1 + 2 as one fader bank.</div></div><div class="mix" id="mix"></div></div>
    </div>
  </main>
</div>
<script src="../pa-menus.js"></script>
<script src="../pa-images.js"></script>
<script src="mock.js"></script>
<script>
PA.nav();
const hex = p => p ? p.replace("0x", "0x").toUpperCase().replace("0X", "0x") : "";
const initial = Object.fromEntries(PA.FX.map(f => [f.id, { ...f.vals }]));

function row(fx, c, adv) {
  const v = fx.vals[c.label];
  const ctl = c.format === "list"
    ? `<select data-fx="${fx.id}" data-p="${c.label}" style="grid-column:2/4">${c.values.map((x, i) => `<option value="${i}" ${i === v ? "selected" : ""}>${x}</option>`).join("")}</select>`
    : `<input type="range" min="${c.min}" max="${c.max}" value="${v}" data-fx="${fx.id}" data-p="${c.label}"><input class="val" data-fx="${fx.id}" data-p="${c.label}" data-num value="${PA.fmt(c, v)}">`;
  return `<div class="pr" data-k="${(fx.name + " " + c.label + " " + c.param).toLowerCase()}" data-adv="${adv ? 1 : ""}" data-row="${fx.id}|${c.label}">
    <div class="pl">${c.label}${adv ? `<span class="adv">ADV</span>` : ""}<i>${hex(c.param)} · ${c.min}…${c.max}</i></div>${ctl}</div>`;
}
const VIZ = { delay: "delay", "g-delay": "delay", reverb: "reverb", "g-reverb": "reverb", "g-bodyrez": "eq", "g-comp": "comp" };
function card(fx) {
  const states = fx.always ? [] : PA.hasHit(fx) ? ["off", "on", "hit"] : ["off", "on"];
  return `<div class="card" id="c-${fx.id}" style="--fc:${PA.color(fx)}">
    <div class="ch">${PA.artHTML(PA.img(fx))}<div><h3>${fx.name}</h3>${fx.styleCell ? `<select data-style="${fx.id}">${fx.styleCell.values.map((s, i) => `<option value="${i}" ${i === fx.style ? "selected" : ""}>${String(i + 1).padStart(2, "0")} ${s}</option>`).join("")}</select>` : `<div class="note">always in the guitar path</div>`}</div>
      ${states.length ? `<div class="seg">${states.map(s => `<button data-st="${fx.id}" data-s="${s}" class="${fx.state === s ? "sel" : ""}">${s.toUpperCase()}</button>`).join("")}</div>` : "<span></span>"}</div>
    ${VIZ[fx.id] ? `<div class="viz" data-viz="${VIZ[fx.id]}" data-fx="${fx.id}"></div>` : ""}
    <div class="rows">${fx.params.map(c => row(fx, c)).join("")}${fx.adv.map(c => row(fx, c, true)).join("")}</div></div>`;
}
document.getElementById("gv").innerHTML = PA.vocal.map(card).join("");
document.getElementById("gg").innerHTML = PA.guitar.map(card).join("");
document.getElementById("side").innerHTML = `<h5>Vocal</h5>` + PA.vocal.map(sideRow).join("") + `<h5>Guitar</h5>` + PA.guitar.map(sideRow).join("") +
  `<h5>Jump to</h5><div class="fxl" onclick="document.getElementById('mx').scrollIntoView({behavior:'smooth'})"><span></span>Sends &amp; mix</div>`;
function sideRow(fx) { return `<div class="fxl ${fx.state === "off" ? "off" : ""}" data-jump="${fx.id}" style="--fc:${PA.color(fx)}"><span class="dot"></span>${fx.name}<span class="st ${fx.state}">${fx.always ? "—" : fx.state.toUpperCase()}</span></div>`; }

// ── visualisations ────────────────────────────────────────────────────────
const W = 320, H = 110, F = i => 20 * Math.pow(1000, i / 240), X = f => Math.log10(f / 20) / 3 * W;
const width = (fx, k) => { const s = PA.cellOf(fx, k).values[fx.vals[k]]; return s === "NARROW" ? .06 : parseFloat(s); };
function drawEQ(el, fx) {
  const v = fx.vals, y = g => H / 2 - g * (H / 2 - 8) / 12;
  const resp = f => { const l = Math.log2(f);
    return v["LOW GAIN"] / (1 + Math.exp((l - Math.log2(F(v["LOW FREQ"]))) * 3)) + v["HI GAIN"] / (1 + Math.exp(-(l - Math.log2(F(v["HI FREQ"]))) * 3))
      + [1, 2].reduce((a, n) => a + v[`PARA ${n} GAIN`] * Math.exp(-((l - Math.log2(F(v[`PARA ${n} FREQ`]))) ** 2) / (2 * (Math.max(.08, width(fx, `PARA ${n} WIDTH`)) / 1.6) ** 2)), 0); };
  let d = ""; for (let x = 0; x <= W; x += 3) { const f = 20 * Math.pow(1000, x / W); d += (x ? "L" : "M") + x + "," + y(resp(f)).toFixed(1); }
  const nodes = [["LOW FREQ", "LOW GAIN", "L"], ["PARA 1 FREQ", "PARA 1 GAIN", "1"], ["PARA 2 FREQ", "PARA 2 GAIN", "2"], ["HI FREQ", "HI GAIN", "H"]];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${[100, 1000, 10000].map(f => `<line x1="${X(f)}" x2="${X(f)}" y1="0" y2="${H}" stroke="#ffffff10"/><text x="${X(f) + 3}" y="${H - 4}">${f >= 1000 ? f / 1000 + "k" : f}</text>`).join("")}
    <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#ffffff18"/>
    <path d="${d} L${W},${H / 2} L0,${H / 2} Z" fill="var(--fc)" fill-opacity=".15"/><path d="${d}" stroke="var(--fc)" stroke-width="2" fill="none"/>
    ${nodes.map(([fk, gk, t]) => `<g data-node="${fk}|${gk}" style="cursor:grab"><circle cx="${X(F(v[fk]))}" cy="${y(v[gk])}" r="9" fill="var(--surface-3)" stroke="var(--fc)" stroke-width="2"/><text x="${X(F(v[fk]))}" y="${y(v[gk]) + 3}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${t}</text></g>`).join("")}
    <text x="4" y="11">+12 dB</text><text x="4" y="${H - 14}">−12</text><text x="${W - 4}" y="11" text-anchor="end">drag the nodes</text></svg>`;
  el.querySelectorAll("[data-node]").forEach(n => n.addEventListener("pointerdown", e => {
    const [fk, gk] = n.dataset.node.split("|"), svg = el.querySelector("svg"); n.setPointerCapture(e.pointerId);
    const mv = ev => { const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W, py = (ev.clientY - r.top) / r.height * H;
      PA.set(fx.id, fk, Math.log10(Math.max(20, 20 * Math.pow(1000, px / W)) / 20) / 3 * 240); PA.set(fx.id, gk, (H / 2 - py) / (H / 2 - 8) * 12); };
    n.addEventListener("pointermove", mv); n.addEventListener("pointerup", () => n.removeEventListener("pointermove", mv), { once: true });
  }));
}
function drawComp(el, fx) {
  const v = fx.vals, ratio = parseFloat(PA.cellOf(fx, "RATIO").values[v.RATIO]), t = v.THRESHOLD, S = 110;
  const m = db => S - (db + 40) / 40 * S, out = i => (i < t ? i : t + (i - t) / ratio) + v["MAKEUP GAIN"];
  let d = ""; for (let i = -40; i <= 0; i += 1) d += (i === -40 ? "M" : "L") + ((i + 40) / 40 * S).toFixed(1) + "," + m(Math.min(0, out(i))).toFixed(1);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><g transform="translate(10,0)"><rect width="${S}" height="${S}" fill="none" stroke="#ffffff14"/>
    <line x1="0" y1="${S}" x2="${S}" y2="0" stroke="#ffffff18" stroke-dasharray="3 3"/><path d="${d}" stroke="var(--fc)" stroke-width="2" fill="none"/>
    <circle cx="${(t + 40) / 40 * S}" cy="${m(Math.min(0, out(t)))}" r="4" fill="var(--fc)"/></g>
    <text x="140" y="24">THRESHOLD ${t} dB</text><text x="140" y="40">RATIO ${ratio}:1</text><text x="140" y="56">MAKEUP +${v["MAKEUP GAIN"]} dB</text>
    <text x="140" y="80">input → output transfer curve</text></svg>`;
}
const DIV = { QUARTER: 1, EIGHTH: .5, TRIPLET: 1 / 3, "DOTTED 1/8": .75, "DOTTED 1/4": 1.5, "1/4 TRIPLET": 2 / 3, SIXTEENTH: .25, HALF: 2, "DOTTED 1/8": .75 };
function drawDelay(el, fx) {
  const lv = fx.vals.LEVEL ?? fx.vals["DELAY LEVEL"], fb = fx.vals.FEEDBACK / 100, tempo = fx.vals.TEMPO || 96, sn = PA.styleName(fx);
  const div = DIV[sn] ?? .5, beat = 60 / tempo, step = div * beat, span = 4 * beat;
  let a = Math.pow(10, lv / 20), bars = "";
  for (let i = 1, t = step; t < span && a > .02; i++, t += step, a *= Math.max(fb, .05)) bars += `<rect x="${10 + t / span * (W - 20) - 3}" y="${H - 18 - a * (H - 30)}" width="6" height="${a * (H - 30)}" rx="2" fill="var(--fc)" opacity="${.4 + a * .6}"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${[0, 1, 2, 3, 4].map(b => `<line x1="${10 + b / 4 * (W - 20)}" x2="${10 + b / 4 * (W - 20)}" y1="6" y2="${H - 18}" stroke="#ffffff${b % 4 ? "10" : "22"}"/>`).join("")}
    <rect x="7" y="12" width="6" height="${H - 30}" rx="2" fill="var(--ink)"/>${bars}<text x="10" y="${H - 5}">one bar at ${tempo} BPM · ${sn}</text></svg>`;
}
function drawReverb(el, fx) {
  const dec = (fx.vals.DECAY ?? fx.vals["REVERB DECAY"]) / 10, pre = (fx.vals["REVERB PRE DLY"] || 0) / 1000, span = 5;
  let d = `M10,${H - 16}`; const x0 = 10 + pre / span * (W - 20);
  d += ` L${x0},${H - 16} L${x0 + 4},20`; for (let x = x0 + 4; x <= W - 10; x += 4) { const t = (x - x0) / (W - 20) * span; d += ` L${x},${(H - 16 - (H - 36) * Math.pow(10, -3 * t / dec)).toFixed(1)}`; }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><path d="${d}" stroke="var(--fc)" stroke-width="2" fill="var(--fc)" fill-opacity=".12"/>
    <text x="${W - 8}" y="14" text-anchor="end">${PA.styleName(fx)} · ${dec.toFixed(1)} s</text><text x="10" y="${H - 4}">0 s</text><text x="${W - 10}" y="${H - 4}" text-anchor="end">${span} s</text></svg>`;
}
function drawViz(fx) {
  const el = document.querySelector(`.viz[data-fx="${fx.id}"]`); if (!el) return;
  ({ eq: drawEQ, comp: drawComp, delay: drawDelay, reverb: drawReverb })[el.dataset.viz](el, fx);
}
PA.FX.forEach(drawViz);

// ── sends + mix ───────────────────────────────────────────────────────────
const SENDS = { // [source][destination] = [param id, value]
  "Lead vocal": { uMOD: [171, -6], Delay: [173, -12], Reverb: [177, -8] }, "Harmony": { uMOD: [172, -36], Delay: [174, -14], Reverb: [178, -6] },
  "uMOD (vocal)": { Delay: [175, -18], Reverb: [180, -10] }, "Delay (vocal)": { Reverb: [179, -12] },
  "Guitar": { uMOD: [181, 0], Delay: [176, -10], Reverb: [182, -9] }, "uMOD (guitar)": { Reverb: [183, -12] } };
const dests = ["uMOD", "Delay", "Reverb"];
document.getElementById("mx").innerHTML = `<tr><th>from ↓ / to →</th>${dests.map(d => `<th>${d}</th>`).join("")}</tr>` +
  Object.entries(SENDS).map(([s, m]) => `<tr><td>${s}</td>${dests.map(d => m[d] ? `<td><div class="send"><input type="range" min="-36" max="0" value="${m[d][1]}" oninput="this.nextElementSibling.textContent=this.value+' dB · 0x'+(${m[d][0]}).toString(16).toUpperCase().padStart(3,'0')"><span>${m[d][1]} dB · 0x${m[d][0].toString(16).toUpperCase().padStart(3, "0")}</span></div></td>` : `<td class="na">—</td>`).join("")}</tr>`).join("");
const mixCells = [...PA_MENUS.MIX.pages[0].rows.flat(), ...PA_MENUS.MIX.pages[1].rows.flat()].filter(Boolean);
const MIXV = [-6, -10, -12, -20, -3, -12, 0, -8, -2];
document.getElementById("mix").innerHTML = mixCells.map((c, i) => `<div class="fader"><b>${c.label}</b><input type="range" min="${c.min}" max="${c.max}" value="${MIXV[i] ?? 0}" oninput="this.nextElementSibling.textContent=this.value+' dB'"><span>${MIXV[i] ?? 0} dB</span><span class="note mono">${c.param}</span></div>`).join("");

// ── wiring ────────────────────────────────────────────────────────────────
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.style) { PA.setStyle(t.dataset.style, +t.value); return; }
  if (t.dataset.fx && !t.dataset.num) PA.set(t.dataset.fx, t.dataset.p, +t.value);
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset.num) return;
  const n = parseFloat(t.value.replace("−", "-")); if (!isNaN(n)) PA.set(t.dataset.fx, t.dataset.p, n);
  syncRow(PA.byId[t.dataset.fx], t.dataset.p);
});
function syncRow(fx, label) {
  const c = PA.cellOf(fx, label), v = fx.vals[label];
  document.querySelectorAll(`[data-fx="${fx.id}"][data-p="${CSS.escape(label)}"]`).forEach(el => { if (el.dataset.num) el.value = PA.fmt(c, v); else el.value = v; });
  document.querySelector(`[data-row="${fx.id}|${CSS.escape(label)}"]`)?.classList.toggle("changed", initial[fx.id][label] !== v);
}
document.addEventListener("pa:change", e => { syncRow(e.detail.fx, e.detail.label); drawViz(e.detail.fx); });
document.addEventListener("pa:style", e => { const fx = e.detail.fx; document.querySelector(`#c-${fx.id} .ch .art`).outerHTML = PA.artHTML(PA.img(fx)); drawViz(fx); });
document.addEventListener("click", e => {
  const s = e.target.closest("[data-st]"); if (s) { PA.setState(s.dataset.st, s.dataset.s); return; }
  const j = e.target.closest("[data-jump]"); if (j) document.getElementById("c-" + j.dataset.jump).scrollIntoView({ behavior: "smooth", block: "center" });
});
document.addEventListener("pa:state", e => {
  const fx = e.detail.fx, c = document.getElementById("c-" + fx.id);
  c.classList.toggle("off", fx.state === "off"); c.querySelectorAll("[data-st]").forEach(b => b.classList.toggle("sel", b.dataset.s === fx.state));
  document.querySelector(`[data-jump="${fx.id}"]`).outerHTML = sideRow(fx);
});
PA.FX.forEach(f => document.getElementById("c-" + f.id).classList.toggle("off", f.state === "off"));

// filters
const q = document.getElementById("q"), tIds = document.getElementById("tIds"), tAdv = document.getElementById("tAdv"), tChg = document.getElementById("tChg");
function filter() {
  const s = q.value.trim().toLowerCase();
  document.querySelectorAll(".pr").forEach(r => r.classList.toggle("hide", (s && !r.dataset.k.includes(s)) || (!tAdv.classList.contains("on") && r.dataset.adv) || (tChg.classList.contains("on") && !r.classList.contains("changed"))));
  document.querySelectorAll(".card").forEach(c => { if (!c.querySelector(".pr")) return; c.style.display = s && !c.querySelector(".pr:not(.hide)") ? "none" : ""; });
}
q.oninput = filter;
[tIds, tAdv, tChg].forEach(b => b.onclick = () => { b.classList.toggle("on"); document.body.classList.toggle("ids", tIds.classList.contains("on")); filter(); });
document.querySelectorAll(".ab button").forEach(b => b.onclick = () => document.querySelectorAll(".ab button").forEach(x => x.classList.toggle("sel", x === b)));
</script>
</body>
</html>
